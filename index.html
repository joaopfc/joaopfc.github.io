<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio CAD 3D & Manufatura Aditiva | João Paulo Faria</title>
  <meta name="description" content="Portfólio com modelos 3D interativos desenvolvidos no Onshape para vagas de Projetista e Desenhista CAD." />

  <!-- Google Model-Viewer Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- Tipografia: Inter e JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Folha de Estilos Externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topbar">
    <div class="container topbar-content">
      <a href="#" class="brand-group">
        <div class="brand-icon">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div class="brand-info">
          <h1>João Paulo Faria de carvalho</h1>
          <span>Projetista Mecânico CAD &bull; Onshape &amp; 3D FDM</span>
        </div>
      </a>
    </div>
  </header>

  <!-- FILTROS & BUSCA -->
  <section class="container controls-panel">
    <div class="search-filter-row">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar peça..." />
      </div>

      <div class="filter-buttons">
        <button class="filter-button active" data-category="all">Todas (<span id="countAll">0</span>)</button>
        <button class="filter-button" data-category="usinagem">Usinagem &amp; Suportes</button>
        <button class="filter-button" data-category="elementos">Elementos de Máquinas</button>
        <button class="filter-button" data-category="tubulacoes">Tubulações</button>
        <button class="filter-button" data-category="chapas">Chapas</button>
        <button class="filter-button" data-category="aditiva">Impressão 3D</button>
      </div>
    </div>
  </section>

  <!-- CATÁLOGO LIMPO -->
  <main class="container">
    <div class="catalog-grid" id="catalogGrid"></div>
  </main>

  <!-- MODAL DE VISUALIZAÇÃO AMPLIADA (APENAS 3D GRANDE) -->
  <div class="modal-backdrop" id="largeViewerModal" role="dialog" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalPieceTitle"><i class="fa-solid fa-cube" style="color: var(--cad-cyan);"></i> Peça 3D</h2>
        <button class="modal-close-icon" id="modalCloseBtn" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body-viewer">
        <model-viewer
          id="modalModelViewer"
          src=""
          camera-controls
          auto-rotate
          rotation-per-second="20deg"
          shadow-intensity="1.5"
          exposure="1.0"
          alt="Modelo 3D Ampliado">
        </model-viewer>
      </div>
    </div>
  </div>

  <!-- Scripts: primeiro a lista de peças, depois a lógica do site -->
  <script src="models-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
